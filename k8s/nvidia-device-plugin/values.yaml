# Run on both GPU nodes: Jetson Orin and Legion WSL.
nodeSelector: {}

# K3s creates this RuntimeClass after discovering nvidia-container-runtime
# on each node.
runtimeClassName: nvidia

# Fail visibly when the worker runtime is not configured correctly.
failOnInitError: true

# Tegra devices are reported as "tegra", which is not a supported device ID
# for the CSV injection path. Numeric indexes work on both Tegra and WSL.
deviceIDStrategy: index
