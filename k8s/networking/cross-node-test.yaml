apiVersion: v1
kind: Namespace
metadata:
  name: netlab
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf-server-wsl
  namespace: netlab
  labels:
    app: iperf-server-wsl
spec:
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: apailegion
  containers:
    - name: iperf3
      image: alpine:3.20
      command:
        - sh
        - -ec
        - |
          apk add --no-cache iperf3
          exec iperf3 -s
      ports:
        - name: iperf3
          containerPort: 5201
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: iperf-server
  namespace: netlab
spec:
  selector:
    app: iperf-server-wsl
  ports:
    - name: iperf3
      port: 5201
      targetPort: iperf3
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: iperf-client-jetson
  namespace: netlab
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: adamp
      containers:
        - name: iperf3
          image: alpine:3.20
          command:
            - sh
            - -ec
            - |
              apk add --no-cache iperf3
              until nc -z iperf-server 5201; do sleep 1; done
              iperf3 -c iperf-server -t 20
              iperf3 -c iperf-server -t 20 -R
